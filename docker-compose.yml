# 本地开发用的 PostgreSQL 数据库
# 用户名/密码/库名从同目录的 .env 读取（docker compose 会自动加载 .env）
services:
  db:
    image: postgres:16-alpine
    container_name: manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 只绑定本机回环地址，局域网内其他设备无法连接
      # 端口用 5433：你机器上已有原生 PostgreSQL 占用 5432，避免冲突
      - "127.0.0.1:5433:5432"
    volumes:
      # 数据存在 Docker 卷里，容器删了数据还在
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
